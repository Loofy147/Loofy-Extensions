name: Validate extension contracts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Schema and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install pinned development dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Validate extension manifests
        run: python scripts/validate_manifests.py
